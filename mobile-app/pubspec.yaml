name: physlive_mobile
description: "PhysLive - Interactive Physics Simulation Platform Mobile App"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/player/player.html
    - assets/brand/logo.png
    - assets/illustrations/
